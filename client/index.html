<!DOCTYPE html> <!-- Dit au navigateur : ceci est une page HTML moderne. -->
<html lang="fr"> <!-- Balise racine. lang="fr" annonce que la page est en français. -->
<head> <!-- En-tête : informations sur la page, pas le contenu visible. -->
  <meta charset="utf-8"> <!-- Les lettres accentuées (é, è) sont lues correctement. -->
  <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- Sur un téléphone, la largeur de la page suit la largeur de l'écran, sans zoom forcé. -->
  <title>Dépenses</title> <!-- Texte de l'onglet du navigateur. -->
  <link rel="manifest" href="/manifest.webmanifest"> <!-- Fiche qui permet de proposer l'installation comme application. Voir manifest-commentaires.txt. -->
  <link rel="preconnect" href="https://fonts.googleapis.com"> <!-- Ouvre tôt la connexion vers le site des polices, pour gagner un peu de temps. -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> <!-- Deuxième adresse du même service de polices. crossorigin autorise cette connexion anticipée. -->
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0&display=swap" rel="stylesheet"> <!-- Charge la police Geist et les icônes « Material Symbols ». -->
  <link rel="stylesheet" href="/css/style.css"> <!-- Charge notre fichier d'apparence : couleurs, marges, menu. -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script> <!-- Charge Chart.js, la bibliothèque qui dessine les graphiques. -->
</head> <!-- Fin de l'en-tête. -->
<body> <!-- Corps : ce que la page contient. Au départ il est presque vide, le JavaScript le remplit. -->
  <div id="app"></div> <!-- Zone unique où app.js écrira tout l'écran. id="app" permet de la retrouver. -->
  <script type="module" src="/js/app.js"></script> <!-- Lance le programme de la page. type="module" autorise les import entre fichiers. -->
</body> <!-- Fin du corps. -->
</html> <!-- Fin de la page. -->
